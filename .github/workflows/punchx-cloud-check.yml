name: PunchX Cloud Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/capacitor-android
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/punchx-cloud-check.yml'

permissions:
  contents: read

jobs:
  web-build:
    name: Install dependencies and build web assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Android development branch
        uses: actions/checkout@v4
        with:
          ref: feature/capacitor-android

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Vite web assets
        run: npm run build:pages

      - name: Upload web build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: punchx-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
