    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #07122a;
        color: #e1e3e4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        overflow-x: hidden;
      }
      #initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        background-color: #07122a;
        color: #ffffff;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .initial-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(197, 160, 89, 0.2);
        border-top-color: #c5a059;
        border-radius: 50%;
        animation: init-spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes init-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // SPA Single Page App redirect restoration for GitHub Pages custom domains
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

      // Suppress benign Vite HMR WebSocket connection errors in dev server environment
      (function() {
        function isViteWsError(err) {
          if (!err) return false;
          var msg = (err.message || err.reason || err.stack || String(err)).toLowerCase();
          return msg.includes('websocket') || msg.includes('vite') || msg.includes('ws');
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isViteWsError(event.error) || isViteWsError(event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body style="margin: 0; background-color: #07122a; color: #ffffff;">
    <div id="root">

    <div id="recaptcha-container"></div>
    <script type="module" src="/src/main.tsx"></script>
